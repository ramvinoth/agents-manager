# The gates every change must pass before it reaches a customer box. Mirrors
# what runs locally: hermetic Python unit tests (no DB, no network — enforced
# by tests/unit/conftest.py), web lint/typecheck/tests/build, mobile
# typecheck/tests. Linux + macOS because deploy/lib.sh installs on both.
name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]   # 3.9 = macOS /usr/bin/python3 the LaunchAgent runs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest psycopg2-binary tomli_w
      - run: python -m pytest -q tests/unit

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run tsc
      - run: npm test

  # A real fresh install on the distro customer boxes run (WSL2 → Ubuntu 24.04):
  # catches installer breakage (PEP 668 pip, too-old distro node) before a
  # customer does.
  installer:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - run: SRC="$GITHUB_WORKSPACE" bash deploy/smoke-install.sh
